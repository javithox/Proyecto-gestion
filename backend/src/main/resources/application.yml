
spring:
  application:
    name: catastro-equipos

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catastro_db}
    username: ${SPRING_DATASOURCE_USERNAME:catastro_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

  web:
    resources:
      static-locations: classpath:/static/

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    cookie-secure: ${APP_COOKIE_SECURE:false}
    session-hours: ${APP_SESSION_HOURS:12}
  bootstrap:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD}
    name: ${APP_ADMIN_NAME:Administrador}
    email: ${APP_ADMIN_EMAIL:}
    employee-code: ${APP_ADMIN_EMPLOYEE_CODE:}
